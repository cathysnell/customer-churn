# Databricks App manifest — Retention Cockpit (Stage 6).
#
# The app runs as its service principal. DATABRICKS_HOST and the OAuth token are
# injected by the Apps runtime. `valueFrom` binds to app resources declared in the
# bundle (../databricks.yml) — declaring a resource with a permission auto-grants that
# permission to the app SP at deploy (warehouse CAN_USE, secret CAN_READ). UC SELECT/
# EXECUTE and the Lakebase Postgres grant are NOT auto-granted — see app/grants.sql
# and docs/app-deploy-runbook.md.
#
# The runtime installs from package.json and runs `npm run start`; its `prestart` hook
# builds dist/ in the runtime. The server reads DATABRICKS_APP_PORT and binds 0.0.0.0.

command: ["npm", "run", "start"]

env:
  # Warehouse id comes from the bundle's sql_warehouse resource (CAN_USE auto-granted).
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  - name: GENIE_SPACE_ID
    value: "01f1ad360e121f099e3070de938cd8cb"
  - name: DATA_CATALOG
    value: "dev_churn"

  # --- Lakebase (the "do this now" queue). Commented out for the first deploy: with
  # these unset the queue falls back to the warehouse. Uncomment once the Lakebase
  # secret + connection are wired (see runbook), and grant the app SP on Postgres. ---
  # - name: LAKEBASE_HOST
  #   value: "<instance>.database.cloud.databricks.com"
  # - name: LAKEBASE_USER
  #   value: "<app-sp-role>"
  # - name: LAKEBASE_DATABASE
  #   value: "databricks_postgres"
  # - name: LAKEBASE_PASSWORD
  #   valueFrom: "lakebase-password"
